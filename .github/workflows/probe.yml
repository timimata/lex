name: Probe

# Every six hours, the deployed demo from outside (Phase 8): health, an article, a search, a
# page example's answer from the cache (no quota), an unknown path and the instance's usage, each
# timed. A failure is GitHub's email to the owner: the demo is down, slow, or spending quota on
# what should be cached.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

jobs:
  probe:
    if: github.repository == 'timimata/lex-pt' # not the public mirror's copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e . --no-deps # the probe needs the standard library only
      - run: python -m lex.probe https://lex-beryl.vercel.app
