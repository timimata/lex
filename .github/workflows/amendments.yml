name: Amendments

# Once a week, one request to the PGDL and one render of the DR per diploma: has the Código do
# Trabalho, the Código Civil or the NRAU been amended since the corpus was built? A failure means
# the demo may answer with outdated law until a person checks the amendment and rebuilds the
# corpus.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    if: github.repository == 'timimata/lex-pt' # not the public mirror's copy, as probe.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"
      - run: pip install -e ".[ingest]"
      - run: playwright install --with-deps chromium # the DR's page is rendered (ADR 0005)
      # The PGDL's list and the DR's, the reference; an act of a kind the check cannot read
      # fails it too.
      - run: python -m lex.ingest check-updates --dr
