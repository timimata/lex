name: Amendments

# Once a week, one request to the PGDL per diploma: has the Código do Trabalho, the Código Civil
# or the NRAU been amended since the corpus was built? A failure means the demo may answer with
# outdated law until a person checks the amendment and rebuilds the corpus.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e .
      - run: python -m lex.ingest check-updates
