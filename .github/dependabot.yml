# Weekly updates of pinned dependencies (ROADMAP, Phase 12). An update that can change a number
# (the models' clients, sentence-transformers, torch, the store) comes with a dev run before it is
# merged; uv.lock is updated with `uv lock` (ADR 0019).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
